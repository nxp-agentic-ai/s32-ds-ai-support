[build-system]
requires = ["setuptools>=81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxp-mcp-compiler"
version = "1.0.0"
description = "Compiler MCP server - external toolchains (GCC, LAX, SPT)"
requires-python = ">=3.11"
dependencies = [
  "nxp-mcp-shared==1.0.0",
  "fastmcp==3.3.1",
  "pyyaml==6.0.3",
]

[tool.setuptools]
package-dir = {"nxp.mcp.compiler" = "src"}

packages = [
  "nxp.mcp.compiler",
  "nxp.mcp.compiler.actions",
  "nxp.mcp.compiler.config",
  "nxp.mcp.compiler.handlers",
  "nxp.mcp.compiler.impl",
  "nxp.mcp.compiler.metadata",
  "nxp.mcp.compiler.prompts",
  "nxp.mcp.compiler.resources",
  "nxp.mcp.compiler.server",
  "nxp.mcp.compiler.tools",
]

[project.scripts]
nxp-mcp-compiler = "nxp.mcp.compiler.main:main"

[project.entry-points."nxp.mcp.servers"]
compiler = "nxp.mcp.compiler"
